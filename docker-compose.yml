version: "3.9"

services:
  # ===========================================================================
  # 1. PostgreSQL with pgvector (Vector Database Engine)
  # ===========================================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: wise_wolves_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: copilot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d copilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # 2. FastAPI Strict RAG Backend Engine
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wise_wolves_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/copilot_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ===========================================================================
  # 3. React 19 / Vite Frontend Interface
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wise_wolves_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
